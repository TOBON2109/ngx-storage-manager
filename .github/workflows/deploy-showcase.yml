name: CI and Deploy Showcase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Pruebas unitarias con cobertura (100%)
        run: npx ng test ngx-storage-manager --no-watch --coverage

      - name: Compilar la librería
        run: npx ng build ngx-storage-manager

  build:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: showcase
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: showcase/package-lock.json

      - run: npm ci

      - run: npx ng build --configuration production --base-href /ngx-storage-manager/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: showcase/dist/showcase/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verificar que la app responde después del despliegue
        run: |
          URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          echo "Verificando $URL"
          curl --fail --silent --show-error --location \
            --retry 10 --retry-delay 15 --retry-all-errors \
            --output page.html "$URL"
          grep -qi "<app-root" page.html
          echo "OK: la aplicación está disponible y responde"